name: ExamCompanion
options:
  bundleIdPrefix: com.djhizon
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.djhizon.examcompanion
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  ExamCompanion:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Exam Companion
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: Connect to your exam laptop on Wi-Fi to send foreground-only presence checks.
        NSCameraUsageDescription: Used only to scan the pairing QR code from your laptop
        # ATS: NSAllowsLocalNetworking exempts LAN/.local hosts only; internet hosts stay HTTPS-only.
        # Release builds additionally refuse http:// pairing links in app code (PresenceController.allowsDemoHTTP).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.djhizon.examcompanion.pairing
            CFBundleURLSchemes: [examcompanion]
  ExamCompanionTests:
    type: bundle.unit-test
    platform: iOS
    # Pure policy tests: the Core sources are compiled straight into the test bundle,
    # so no host app or camera is needed. `swift test` runs the same files against PresenceCore.
    sources: [Tests, Sources/Core]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.djhizon.examcompanion.tests
  ExamCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ExamCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.djhizon.examcompanion.uitests
schemes:
  ExamCompanion:
    build:
      targets:
        ExamCompanion: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [ExamCompanionTests, ExamCompanionUITests]
